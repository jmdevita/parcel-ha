add_parcel:
  fields:
    device_id:
      description: "The device to target."
      example: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
      required: true
      selector:
        device:
          integration: parcelapp
    parcel_name:
      name: "Parcel Name"
      description: "Name/description for the parcel"
      example: "My Parcel"
      required: true
      selector:
        text:
    tracking_number:
      name: "Tracking Number"
      description: "Tracking number for the parcel"
      example: "1234567890"
      required: true
      selector:
        text:
    courier:
      name: "Courier"
      description: "Courier/carrier code (e.g., ups, fedex, usps). If omitted, the carrier will be auto-detected from the tracking number."
      example: "ups"
      required: false
      selector:
        text:
    language:
      name: "Language"
      description: "Language for delivery information (ISO 639-1 two-letter code). Availability depends on carrier."
      example: "en"
      required: false
      default: "en"
      selector:
        text:
    postcode:
      name: "Postcode"
      description: "Postcode of the delivery address. Required by some carriers (e.g. DPD Germany, PostNL); ignored by the others."
      example: "10115"
      required: false
      selector:
        text:
    email:
      name: "Email"
      description: "Email associated with the order. Required by some services (e.g. Apple Store); ignored by the others."
      example: "me@example.com"
      required: false
      selector:
        text:
          type: email
    send_push_confirmation:
      name: "Send Push Notification"
      description: "Send a push notification when the parcel is added"
      required: false
      default: false
      selector:
        boolean:

delete_parcel:
  fields:
    device_id:
      description: "The device to target."
      example: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
      required: true
      selector:
        device:
          integration: parcelapp
    tracking_number:
      example: "1234567890"
      required: true
      selector:
        text:
    type:
      example: "package"
      required: true
      selector:
        text:

edit_parcel:
  fields:
    device_id:
      description: "The device to target."
      example: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
      required: true
      selector:
        device:
          integration: parcelapp
    parcel_name:
      name: "Parcel Name"
      description: "New name for the parcel"
      example: "Updated Parcel Name"
      required: true
      selector:
        text:
    tracking_number:
      name: "Tracking Number"
      description: "New tracking number"
      example: "1234567890"
      required: true
      selector:
        text:
    courier:
      name: "Courier"
      description: "New courier/carrier code. If omitted, the carrier will be auto-detected from the tracking number."
      example: "fedex"
      required: false
      selector:
        text:
    oldNumber:
      name: "Old Tracking Number"
      description: "Current tracking number of the parcel to edit"
      example: "1234567890"
      required: true
      selector:
        text:
    oldType:
      name: "Old Courier"
      description: "Current courier/carrier code of the parcel to edit"
      example: "fedex"
      required: true
      selector:
        text:

detect_carrier:
  fields:
    tracking_number:
      name: "Tracking Number"
      description: "The tracking number to identify the carrier for"
      example: "1Z5R89390357567127"
      required: true
      selector:
        text: